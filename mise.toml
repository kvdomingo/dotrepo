[settings]
experimental = true
prereleases = false
idiomatic_version_file_enable_tools = []
minimum_release_age = "24h"
python.uv_venv_auto = false
fetch_remote_versions_timeout = "10s"

[tools]
usage = "latest"
task = "latest"
node = { version = "lts", postinstall = "npm install -g @fission-ai/openspec@latest @tawandotorg/claude-sync@latest" }
terraform = "latest"
rust = "latest"
helmfile = "latest"
helm = "latest"
jq = "latest"
yq = "latest"
awscli = "latest"
cloudflared = "latest"
go = "sub-0.0.2:latest"
bun = "latest"
vault = "latest"
uv = "latest"
glow = "latest"
tmux = "latest"
dasel = "latest"
"aqua:neovim/neovim" = "latest"
kubectl = "1.32"
doppler = "latest"
hyperfine = "latest"
k9s = "latest"
tflint = "latest"
delta = "latest"
atlas = "latest"
trivy = "latest"
duckdb = "latest"
act = "latest"
bitwarden = "latest"
eza = "latest"
xh = "latest"
dust = "latest"
dua = "latest"
yazi = "latest"
mask = "latest"
mprocs = "sub-0.1:latest"
postgres = "latest"
python = { version = "sub-0.1:latest", postinstall = "pip install -U pip && pip install -r ~/requirements.txt" }
aqua = "latest"
tokei = "latest"
gitleaks = "latest"
krew = "latest"
gemini-cli = "latest"
gh = "latest"
claude-code = "latest"
opencode = "latest"
mc = "latest"
rumdl = "latest"
atuin = "latest"
terraform-docs = "latest"
prek = "latest"
argocd = "latest"
adr-tools = "latest"
terragrunt = "latest"
qwen-code = "latest"
redis = "latest"
pnpm = "latest"
zizmor = "latest"
supabase = "latest"
herdr = "latest"
pi = "latest"
witr = "latest"
infisical = { version = "latest", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }
"aqua:madelynnblue/sqlfmt" = "latest"
lazydocker = "latest"
codex = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
copilot = "latest"
antigravity-cli = "latest"
